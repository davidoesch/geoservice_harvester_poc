name: Check geoservices change statistics

# Runs automatically as part of "Run scraper". This workflow is kept for
# manual re-runs from the Actions tab.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-pipeline
  cancel-in-progress: false

jobs:
  checkChangeStats:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python script
        run: python check-geoservices-stats.py
        env:
          MAIL_SMTP_SERVER: ${{ secrets.MAIL_SMTP_SERVER }}
          MAIL_USER_NAME: ${{ secrets.MAIL_USER_NAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}

      - name: Commit and push change stats file
        run: |
          git config user.name "Q/A"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/geoservices_changestats_CH.csv
          git diff --staged --quiet && exit 0
          git commit -m "Calculate change statistics"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
